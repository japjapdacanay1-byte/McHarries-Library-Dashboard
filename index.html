<title>McHarries Library - Login</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<style>
    body {
        margin: 0;
        background: #eaf4ff;
        font-family: Arial, sans-serif;
    }

    .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-card {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .logo {
        font-size: 55px;
        text-align: center;
    }

    h2 {
        text-align: center;
        color: #0056a7;
        font-weight: bold;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    label {
        font-weight: bold;
    }

    .btn-login {
        width: 100%;
        background: #0056a7;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
    }

    .btn-login:hover {
        background: #003f7d;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
    }
</style>
```

</head>

<body>

<div class="login-container">

```
<div class="login-card">

    <div class="logo">📚</div>

    <h2>McHarries Library</h2>

    <p class="subtitle">
        Library Management System
    </p>

    <form onsubmit="login(event)">

        <div class="mb-3">
            <label>Username</label>

            <input
                type="text"
                id="username"
                class="form-control"
                placeholder="Enter username"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Enter password"
                required>
        </div>

        <button type="submit" class="btn-login">
            LOGIN
        </button>

        <div id="message"></div>

    </form>

</div>
```

</div>

<script>

function login(event) {

    event.preventDefault();

    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;

    if (username === "admin" && password === "password123") {

        document.getElementById("message").innerHTML =
            "<span style='color:green;'>Login successful! Opening dashboard...</span>";

        setTimeout(function() {

            window.location.href = "dashboard.html";

        }, 300);

    } else {

        document.getElementById("message").innerHTML =
            "<span style='color:red;'>Wrong username or password.</span>";

    }

}

</script>

</body>
</html>
